<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teknik Direktör 27 Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e5ebeb;--panel:#ffffff;--ink:#14232c;--mute:#5b6b74;--line:#d0d9dc;--pitch:#1b5a3a;--pitch2:#236b45;--chalk:#f3f7f1;--soft:#eef3f2;--card-y:#f0b90b;--card-r:#c8352b;--focus:#0b5cad;
--t5:#0f6b46;--t5t:#fff;--t4:#3f9a4f;--t4t:#fff;--t3:#b9cb4b;--t3t:#14232c;--t2:#ecbb4c;--t2t:#14232c;--t1:#dc9068;--t1t:#14232c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--panel:#17262d;--ink:#e6efee;--mute:#93a5ab;--line:#2b3d45;--soft:#1d2f37;--pitch:#123f28;--pitch2:#1a5236;--focus:#6db3ff}}
:root[data-theme="dark"]{--bg:#0f1a1f;--panel:#17262d;--ink:#e6efee;--mute:#93a5ab;--line:#2b3d45;--soft:#1d2f37;--pitch:#123f28;--pitch2:#1a5236;--focus:#6db3ff}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 40px}
/* header */
.top{background:var(--pitch);color:var(--chalk);padding:14px 0;border-bottom:4px solid var(--card-y)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:0}
.club{font:700 34px/1 'Barlow Condensed',Impact,sans-serif}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.85;margin-top:4px}
.bud{text-align:right}.bud span{display:block;font-size:12px;opacity:.8}.bud b{font:700 28px/1 'Barlow Condensed',Impact,sans-serif}
.hbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid rgba(243,247,241,.5);color:var(--chalk);padding:6px 10px;border-radius:4px;font-size:13px}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font:600 20px/1 'Barlow Condensed',Impact,sans-serif;white-space:nowrap;color:var(--mute)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pitch2)}
main{padding-top:18px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}.club{font-size:28px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
.panel h2{font-size:22px;margin-bottom:8px}
.panel h3{font-size:18px;margin:12px 0 6px}
.mute{color:var(--mute)}.small{font-size:13px}
.btn{background:var(--pitch2);color:#fff;border:0;padding:10px 16px;border-radius:5px;font-weight:600}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--card-r)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* chips */
.chip{display:inline-block;min-width:32px;text-align:center;font:700 16px/1 'Barlow Condensed',Impact,sans-serif;padding:4px 6px;border-radius:4px}
.r5{background:var(--t5);color:var(--t5t)}.r4{background:var(--t4);color:var(--t4t)}.r3{background:var(--t3);color:var(--t3t)}.r2{background:var(--t2);color:var(--t2t)}.r1{background:var(--t1);color:var(--t1t)}
.chip.pot{background:transparent;border:2px solid currentColor}
.chip.rng{min-width:52px;font-size:15px}
.pfs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pf{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--soft)}.pf.main{background:var(--pitch2);border-color:var(--pitch2);color:#fff}
.sp{display:inline-block;margin-left:4px;font:600 11px/1 'Barlow Condensed',sans-serif;color:var(--mute);vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font:700 12px/1.6 'Barlow Condensed',sans-serif;text-align:center;color:var(--mute)}
.cal .dc{min-height:80px;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;background:var(--panel);cursor:pointer;position:relative;text-align:left;transition:border-color .15s,transform .15s}
.cal .dc:hover{border-color:var(--pitch2)}
.cal .dc.past{opacity:.66}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--pitch2)}
.cal .dc.sel{outline:3px solid var(--focus);outline-offset:1px;z-index:1}
.cal .dc.win{background:color-mix(in srgb,var(--pitch2) 9%,var(--panel))}
.cal .dc.emp{border:0;background:none;cursor:default}
.cal .dc .dn{font-weight:700;display:inline-block;font-size:12px}
.cal .dc .dn.t{background:var(--pitch2);color:#fff;border-radius:999px;padding:1px 7px}
.cal .dc .ev{display:flex;grid-template-columns:none;align-items:center;gap:3px;margin-top:3px;font-size:11px;line-height:1.15;padding:1px 3px;border-radius:3px;border-left:3px solid transparent}
.cal .dc .ev .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cal .dc .ev .tp{display:none;font-weight:700}
.cal .dc .ev .rs{font-weight:700;margin-left:auto}
.cal .dc .ev.lg{border-left-color:var(--mute);background:var(--soft)}
.cal .dc .ev.lg.rW{border-left-color:var(--pitch2);background:color-mix(in srgb,var(--pitch2) 16%,transparent)}
.cal .dc .ev.lg.rD{border-left-color:var(--card-y);background:color-mix(in srgb,var(--card-y) 18%,transparent)}
.cal .dc .ev.lg.rL{border-left-color:var(--card-r);background:color-mix(in srgb,var(--card-r) 14%,transparent)}
.cal .dc .ev.eu{border-left-color:#2f4fb0;background:color-mix(in srgb,#2f4fb0 12%,transparent);color:#2f4fb0}
.cal .dc .ev.wn{border-left-color:var(--pitch2);color:var(--pitch2);font-weight:600}
.cal .dc .ev.ct{border-left-color:var(--card-r);color:var(--card-r);font-weight:600}
.cal .dc .ev.sc{border-left-color:var(--mute);color:var(--mute)}
.tlb{position:relative;height:30px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.tlb .ws{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--pitch2) 22%,transparent)}
.tlb .tk{position:absolute;top:9px;width:5px;height:12px;margin-left:-2px;border-radius:2px;background:var(--mute);opacity:.55}
.tlb .tk.W{background:var(--pitch2);opacity:1}.tlb .tk.D{background:var(--card-y);opacity:1}.tlb .tk.L{background:var(--card-r);opacity:1}.tlb .tk.eu{background:#2f4fb0;opacity:.9;height:16px;top:7px}
.tlb .tdy{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ink)}
.tlm{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:2px 2px 0}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.mb{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:999px;background:rgba(0,0,0,.12);font-size:11px;text-align:center}
.seg button[aria-pressed="true"] .mb{background:rgba(255,255,255,.28)}
.dcard{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;background:var(--soft)}
.up{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.up:last-child{border-bottom:0}.up:hover{background:var(--soft)}
.up .ud{font:700 15px/1.1 'Barlow Condensed',sans-serif}
.cstat{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.cstat div{font-size:12px;color:var(--mute)}.cstat b{display:block;font:700 22px/1 'Barlow Condensed',sans-serif;color:var(--ink)}
@media(max-width:600px){.cal{gap:2px}.cal .dc{min-height:62px;padding:2px}.cal .dc .ev{padding:1px 2px;justify-content:center}.cal .dc .ev .tx{display:none}.cal .dc .ev .tp{display:inline}.cal .dc .ev.lg .rs{margin-left:0;font-size:11px}.up{grid-template-columns:54px 1fr}.up .ur{display:none}}
.scr{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.scr h3{margin:0 0 4px}
.bslide{width:100%}
.chip.pot.r5{color:var(--t5)}.chip.pot.r4{color:var(--t4)}.chip.pot.r3{color:#8a9a1f}.chip.pot.r2{color:#b98a12}.chip.pot.r1{color:#c0663a}
.dual{display:inline-block;position:relative;width:70px;height:8px;background:var(--soft);border-radius:4px;vertical-align:middle;overflow:hidden}
.dual b{position:absolute;left:0;top:0;bottom:0;background:var(--card-y);opacity:.75}
.dual i{position:absolute;left:0;top:0;bottom:0;background:var(--pitch2);z-index:1}
.pos{display:inline-block;width:38px;text-align:center;font:700 13px/1 'Barlow Condensed',sans-serif;padding:4px 0;border-radius:3px;color:#fff}
.pos.GK{background:#b2861a}.pos.DEF{background:#2f6fb0}.pos.MID{background:#2d8a5a}.pos.ATT{background:#b24a3a}
.inj{color:var(--card-r);font-weight:700}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px;cursor:default}
th[data-act]{cursor:pointer}
td.n,th.n{text-align:right}
tr[data-act]{cursor:pointer}tr[data-act]:hover td{background:var(--soft)}
.me td{background:color-mix(in srgb,var(--card-y) 22%,transparent)}
.z-up td:first-child{box-shadow:inset 4px 0 var(--pitch2)}.z-dn td:first-child{box-shadow:inset 4px 0 var(--card-r)}
.star{background:none;border:0;font-size:18px;color:var(--line);padding:0 4px}.star.on{color:var(--card-y)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pitch2);border-color:var(--pitch2);color:#fff}
select{font:inherit;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
/* next match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:8px 0 12px}
.vs .tn{font:700 26px/1.05 'Barlow Condensed',Impact,sans-serif}
.vs .at{font-size:12px;color:var(--mute)}
.cmp{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.cmp .bb{display:flex;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.cmp .bb i{display:block;background:var(--pitch2)}.cmp .bb u{display:block;background:var(--card-y);flex:1}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li[data-act]{cursor:pointer}
/* pitch */
.pitchbox{max-width:560px;margin:0 auto}
.pitch{position:relative;width:100%;aspect-ratio:68/88;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 9.09%,var(--pitch2) 9.09% 18.18%);border:3px solid var(--pitch)}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.5);pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:78px;text-align:center;background:rgba(10,30,20,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 2px 5px;line-height:1.1}
.tok:hover{background:rgba(10,30,20,.9)}
.tok .tp{font:700 12px/1 'Barlow Condensed',sans-serif;opacity:.8}
.tok .tn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;margin:2px 0}
.tok .tr{font:700 15px/1 'Barlow Condensed',sans-serif}
.tok .tr em{font-style:normal;color:var(--card-y)}
.tok.man{border-color:var(--card-y)}
@media(max-width:520px){.tok{width:62px}.tok .tn{font-size:11px}}
/* modal */
#modal:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(6,16,20,.6);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.md{background:var(--panel);border-radius:8px;max-width:560px;width:100%;padding:18px;border:1px solid var(--line)}
.md h2{font-size:28px}
.close{float:right;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:2px 10px;font-size:18px}
.stat{display:grid;grid-template-columns:70px 1fr 30px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.sb{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.sb i{display:block;height:100%;background:var(--pitch2)}
.big{display:flex;gap:16px;align-items:center;margin:10px 0}
.big .chip{font-size:34px;padding:8px 14px}
.big small{display:block;font-size:12px;color:var(--mute);text-align:center;margin-top:3px}
.score{font:700 54px/1 'Barlow Condensed',Impact,sans-serif;text-align:center;margin:6px 0}
.ev{display:grid;grid-template-columns:40px 1fr;gap:6px;font-size:14px;padding:3px 0}
.ev.a{direction:ltr}
.kc{display:inline-block;width:9px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30;font-weight:600;max-width:90vw}
.crest{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,28px);height:calc(var(--s,28px)*1.14);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:calc(var(--s,28px)*.36);line-height:1;letter-spacing:.02em;padding-bottom:calc(var(--s,28px)*.16);vertical-align:middle}
.tc{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.z-cl td:first-child{box-shadow:inset 4px 0 var(--pitch2)}.z-el td:first-child{box-shadow:inset 4px 0 var(--card-y)}.z-ecl td:first-child{box-shadow:inset 4px 0 #4a9fc4}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.gg .panel{margin:0;padding:10px}.gg h3{margin:0 0 4px}
.tie{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tie:last-child{border-bottom:0}.tie .r{text-align:right}.tie .w{font-weight:700}
.crest.lg{clip-path:none;background:none;padding:0;height:var(--s,28px)}
.crest.lg img{width:100%;height:100%;object-fit:contain}
input.num{font:inherit;padding:8px;width:150px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
/* premium motion */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes chipPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes tokIn{from{opacity:0;transform:translate(-50%,-20%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25);color:var(--card-y)}100%{transform:scale(1)}}
@keyframes dotPop{from{transform:scale(0)}60%{transform:scale(1.5)}to{transform:scale(1)}}
main.enter .panel{animation:rise .6s var(--ease) both}
main.enter .chip{animation:chipPop .5s cubic-bezier(.3,1.6,.4,1) both;animation-delay:.3s}
main.enter .dual i,main.enter .dual b{transform-origin:left;animation:grow .9s var(--ease) both;animation-delay:.35s}
main.enter tbody tr{animation:rowIn .45s var(--ease) both}
main.enter .tok{animation:tokIn .6s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--d,0)*1ms)}
.start.enter>*{animation:rise .7s var(--ease) both}
.panel{transition:box-shadow .3s,transform .3s}
.panel:hover{box-shadow:0 14px 32px -20px rgba(6,20,14,.45)}
.btn{transition:transform .18s var(--ease),box-shadow .25s,filter .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 18px -10px rgba(0,0,0,.55);filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:none}
.seg button,.ghost,.close{transition:background .2s,transform .15s var(--ease),border-color .2s}
.seg button:active,.ghost:active{transform:scale(.95)}
tr[data-act] td{transition:background .2s}
.list li[data-act]{transition:background .2s,padding-left .25s var(--ease)}.list li[data-act]:hover{padding-left:6px;background:var(--soft)}
.tok{transition:background .2s,border-color .2s,box-shadow .25s}.tok:hover{box-shadow:0 8px 20px -8px rgba(0,0,0,.7);border-color:rgba(255,255,255,.75)}
.club{letter-spacing:.005em}
.top{background:linear-gradient(118deg,var(--pitch) 0%,var(--pitch2) 60%,var(--pitch) 100%)}
nav.tabs .wrap{position:relative}
nav.tabs button[aria-selected="true"]{border-bottom-color:transparent}
.ind{position:absolute;bottom:0;height:3px;background:var(--pitch2);border-radius:3px;transition:left .42s var(--ease),width .42s var(--ease);pointer-events:none}
.ov{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.fresh{animation:fadeIn .25s both}.ov.fresh .md{animation:pop .42s cubic-bezier(.2,1.1,.3,1) both}
.md{box-shadow:0 34px 80px -30px rgba(0,0,0,.7)}
.ov.fresh .chip{animation:chipPop .5s cubic-bezier(.3,1.6,.4,1) both;animation-delay:.25s}
.toast{animation:toastIn .4s cubic-bezier(.2,1,.3,1) both;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.score{display:block;font-size:64px;letter-spacing:.04em}.score.bump{animation:bump .45s var(--ease)}
.tl{position:relative;height:6px;background:var(--soft);border-radius:3px;margin:10px 0 20px}
.tl .tlf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--pitch2),var(--card-y));border-radius:3px}
.tl .mk{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--pitch2);border:2px solid var(--panel);transform:scale(0)}
.tl .mk.on{animation:dotPop .45s both}
.tick{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s var(--ease)}.tick.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tick{opacity:1;transform:none}.tl .mk{transform:scale(1)}}
/* start */
.start{max-width:860px;margin:0 auto;padding:36px 14px 60px}
.start h1{font-size:56px;line-height:.95}
.start h1 small{font-size:26px;color:var(--pitch2)}
.lgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:18px 0}
.lgs button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.lgs button b{display:block;font:700 18px/1.1 'Barlow Condensed',sans-serif}
.lgs button span{font-size:12px;color:var(--mute)}

const ownE=(t,ti,p)=>({p,club:t.name,lg:G.lid,cs:t.base,ti,key:'#'+p.id,rk:t.pl.filter(z=>z.ovr>p.ovr).length});
const extE=p=>({p,club:p.club,lg:p.lg,cs:clubStr(p.lg,p.club),key:'#'+p.id,rk:8,ext:1});
const freeE=p=>({p,club:'Serbest',lg:'',cs:0,key:'#'+p.id,rk:30,free:1});
function allEntries(){
 const taken=new Set(G.taken),out=[];
 G.teams.forEach((t,ti)=>{if(ti===G.ti)return;t.pl.forEach(p=>out.push(ownE(t,ti,p)))});
 G.ext.forEach(p=>out.push(extE(p)));
 G.free.forEach(p=>out.push(freeE(p)));
 vUniverse().list.forEach(e=>{if(!taken.has(e.key))out.push(e)});

function findEntry(id){
 for(let ti=0;ti<G.teams.length;ti++){if(ti===G.ti)continue;const t=G.teams[ti],p=t.pl.find(x=>x.id===id);if(p)return ownE(t,ti,p)}
 let p=G.ext.find(x=>x.id===id);if(p)return extE(p);
 p=G.free.find(x=>x.id===id);if(p)return freeE(p);
 const e=vUniverse().byId.get(id);return e&&!G.taken.includes(e.key)?e:null;
}
function vStats(e){
 const p=e.p;const prog=Math.min(1,G.week/Math.max(1,G.fix.length)),h=h01(e.key+'a');
 const pf=e.rk<11?.8+.15*h:e.rk<16?.45+.2*h:.1+.2*h;const ap=Math.round(34*prog*pf);
 const gr=({ST:.45,LW:.28,RW:.28,CAM:.22,CM:.08,CDM:.04,CB:.04,LB:.03,RB:.03,GK:0})[p.pos]*Math.pow(p.ovr/75,3);
 const ar=(ASW[p.pos]||0)*.07*Math.pow(p.ovr/75,2);
 return{ap,g:Math.round(ap*gr*(.7+.6*h01(e.key+'g'))),a:Math.round(ap*ar*(.7+.6*h01(e.key+'s')))};
}
const statsOf=e=>e.ti!==undefined?{ap:e.p.ap||0,g:e.p.sg||0,a:e.p.as||0}:e.free?{ap:0,g:0,a:0}:vStats(e);

const winKey=()=>G.season+'-'+(G.week<Math.floor(G.fix.length/2)-1?0:1);
function isListed(e){if(e.free)return false;const p=e.p;if(mo(p)<35)return true;if(e.rk<5)return false;return h01(e.key+'L'+winKey())<(p.ct<=1?.25:.07)}
function isLoanL(e){if(e.free)return false;const p=e.p;if(e.rk<8)return false;const h=h01(e.key+'K'+winKey());return p.age<=23?h<.3:(e.rk>=15&&h<.15)}
const LMM={};
function lgRel(lid,cs){const L=LGM[lid];if(!L)return .5;let m=LMM[lid];if(!m){const s=L.teams.map(t=>t.str);m=LMM[lid]=[Math.min(...s),Math.max(...s)]}return m[1]>m[0]?clamp((cs-m[0])/(m[1]-m[0]),0,1):.5}
function askPrice(e){
 if(e.free)return 0;const p=e.p;
 let f=.95+.4*lgRel(e.lg,e.cs);
 f*=e.rk<2?1.25:e.rk<5?1.12:e.rk<11?1.03:.9;
 f*=[.7,.7,.88,1,1.08,1.15][clamp(p.ct,0,5)];
 if(p.age<=21&&p.pot-p.ovr>=8)f*=1.1;
 if(mo(p)<40)f*=.9;
 if(isListed(e))f*=.72;
 return +(val(p,e.lg)*f).toFixed(2);
}
const minPrice=e=>+(askPrice(e)*(.86+.08*h01(e.key+'m'+G.season))).toFixed(2);
function demands(e){const p=e.p,mine=wageFor(p,WLG,WUC),cw=p.wg||mine;let w=clamp(cw*(e.free?.9:1.12),mine*.85,mine*1.9)*(.95+.2*h01(e.key+'w'));if(mo(p)<40)w*=.94;const b=w*(e.free?1.1:.4)*(.8+.4*h01(e.key+'b'));return{w:+w.toFixed(2),b:+b.toFixed(2)}}
function loanTerms(e){const v=val(e.p,e.lg);return{fee:Math.max(.05,+(v*(e.rk<11?.08:.04)).toFixed(2)),ws:e.rk<11?100:e.rk<16?75:50,opt:+(askPrice(e)*1.05).toFixed(2)}}
function negOf(e){G.neg=G.neg||{};let n=G.neg[e.key];if(!n||n.wk!==winKey())n=G.neg[e.key]={n:0,off:0,wk:winKey()};return n}
function winOpen(){const n=G.fix.length,w=G.week,m=Math.floor(n/2);return w<4||(w>=m-1&&w<m+2)}
function winInfo(){const n=G.fix.length,w=G.week,m=Math.floor(n/2);
 if(w<4)return'Yaz transfer dönemi açık, '+(4-w)+' hafta kaldı';
 if(w>=m-1&&w<m+2)return'Kış transfer dönemi açık, '+(m+2-w)+' hafta kaldı';
 if(w<m-1)return'Transfer dönemi kapalı. Kış dönemi '+m+'. haftada açılır';
 return'Transfer dönemi kapalı. Yaz dönemi yeni sezonda açılır'}
function refuses(p){const o=U().pl.map(x=>x.ovr).sort((a,b)=>b-a).slice(0,14);const avg=o.reduce((a,b)=>a+b,0)/o.length;return p.ovr>=76&&p.ovr>avg+7}

 if(e.ti!==undefined){const tm=G.teams[e.ti],idx=tm.pl.indexOf(e.p);if(idx<0)return null;const q=tm.pl.splice(idx,1)[0];for(const k in tm.manual)if(tm.manual[k]===q.id)delete tm.manual[k];return q}
 if(e.ext){G.ext=G.ext.filter(x=>x!==e.p);return e.p}
 if(e.free){G.free=G.free.filter(x=>x!==e.p);return e.p}
 G.taken.push(e.key);const q=JSON.parse(JSON.stringify(e.p));q.id=UID++;return q;

 const s=statsOf(e);const q=takeFrom(e);if(!q)return'Oyuncu artık bu kulüpte değil.';

 if(e.ti===undefined){if(s.ap)q.hs=(q.hs||[]).concat({s:G.season,c:e.club,ap:s.ap,g:s.g,a:s.a}).slice(-10);q.sg=0;q.as=0;q.ap=0}
 cleanP(q);q.eg=0;q.ea=0;q.ep=0;q.wg=w;q.ct=y;q.pri=false;q.mo=clamp(mo(q)+15,5,95);q.bf=fee;if(so)q.soc={club:e.club,pct:so};

 save();toast(q.n+' kadroya katıldı ('+(fee?fm(fee):'bedelsiz')+', menajer '+fm(ag)+(b?', imza primi '+fm(b):'')+')');return null;

function tryOffer(id,v,so){
 const e=findEntry(id),m=UI.modal;if(!e){UI.modal=null;R();return}

 if(!winOpen())msg='Transfer dönemi kapalı.';
 else if(ng.off)msg=e.club+' bu transfer döneminde seninle görüşmeyi kesti.';
 else if(!(v>0))msg='Geçerli bir tutar gir.';
 else if(v>U().bud)msg='Bütçen bu teklif için yetersiz.';
 else if(refuses(p))msg=p.n+' takımının seviyesini yetersiz buluyor ve gelmeyi reddetti.';
 else if(e.ti!==undefined&&G.teams[e.ti].pl.filter(x=>x.pos===p.pos).length<=MINP[p.pos])msg=e.club+' bu mevkide yedeksiz kalmak istemiyor.';
 else{

  ng.n++;
  if(eff>=mn*.85&&ng.n<4){
   const s2=so<20&&h01(e.key+'c'+ng.n)<.45?20:so;const c=+(mn/(1+s2*.006)*1.02).toFixed(2);
   UI.modal={t:'offer',id,v:c,so:s2,msg:e.club+' karşı teklif yaptı: '+fm(c)+(s2?' + sonraki satıştan %'+s2+' pay':'')+'. Kabul etmek için bu şartlarla gönder.'};R();return}
  if(ng.n>=4){ng.off=1;msg=e.club+' teklifini reddetti ve bu dönem görüşmeyi kesti.'}
  else msg=e.club+' bu teklifi reddetti. Kalan görüşme hakkı: '+(4-ng.n)+'.';
 }
 UI.modal=Object.assign({},m,{v,so,msg});R();

function tryWage(id,w,b,y){

 if(!winOpen())msg='Transfer dönemi kapalı.';
 else if(!(w>0))msg='Geçerli bir maaş gir.';
 else if(billNow()+w>G.wb+1e-9)msg='Maaş bütçesini aşıyor. Kalan pay: '+fmW(Math.max(0,G.wb-billNow()))+'.';

 UI.modal=Object.assign({},m,{v:w,b,y,msg});R();
}

function tryLoan(id,lf,ws,opt){

 const p=e.p,t=U(),ng=negOf(e),T=loanTerms(e);let msg='';opt=Math.max(0,opt||0);lf=Math.max(0,lf||0);
 if(!winOpen())msg='Transfer dönemi kapalı.';
 else if(ng.off)msg=e.club+' bu transfer döneminde seninle görüşmeyi kesti.';
 else if(t.pl.length>=30)msg='Kadro dolu (en fazla 30 oyuncu).';
 else if(lf>t.bud)msg='Kiralama bedeli için bütçen yetersiz.';
 else if(billNow()+p.wg*ws/100>G.wb+1e-9)msg='Maaş bütçesini aşıyor ('+fmW(p.wg*ws/100)+' pay ödeyeceksin, kalan: '+fmW(Math.max(0,G.wb-billNow()))+').';
 else if(refuses(p))msg=p.n+' takımının seviyesini yetersiz buluyor.';
 else if(!isLoanL(e))msg=e.club+' bu oyuncuyu kiralık vermeyi düşünmüyor.';

  else{ng.n++;
   if(sc>=.6&&ng.n<4){const c=+(T.fee*Math.max(.2,1-(ws-T.ws)/50)*1.02).toFixed(2);UI.modal=Object.assign({},m,{lf:c,ws,opt,msg:e.club+' karşı teklif: kiralama bedeli '+fm(c)+', maaşın %'+ws+'\'i senden.'});R();return}
   if(ng.n>=4){ng.off=1;msg=e.club+' kiralık teklifini reddetti ve görüşmeyi kesti.'}else msg=e.club+' kiralık teklifini reddetti.'}
 }
 UI.modal=Object.assign({},m,{lf,ws,opt,msg});R();
}

function pickBuyer(p,excl){
 const c=[];LG.forEach(l=>l.teams.forEach(t=>{if(l.id===G.lid&&t.name===U().name)return;if(t.name===excl)return;const d=t.str-p.ovr;if(d>=-5&&d<=10)c.push({n:t.name,lg:l.id,w:(l.id===G.lid?1.4:1)*(LVM[l.id]||.6)})}));
 if(!c.length){const l=rnd(LG);return{n:rnd(l.teams).name,lg:l.id}}
 let r=Math.random()*c.reduce((a,x)=>a+x.w,0);for(const x of c){r-=x.w;if(r<=0)return x}return c[0];
}

 if(!winOpen()){G.offers=[];return}
 const t=U();G.offers=(G.offers||[]).filter(o=>o.exp>G.week&&t.pl.some(p=>p.id===o.pid));
 for(const p of shuffle(t.pl.filter(p=>!p.loan))){
  if(G.offers.length>=6)break;if(G.offers.some(o=>o.pid===p.id))continue;
  const v=val(p);let pb=p.tl?.4:v>=1.5?.012:0;if(mo(p)<40)pb*=2;
  if(Math.random()<pb){const b=pickBuyer(p);const base=(val(p)+val(p,b.lg))/2;const price=+(base*(p.tl?.72+Math.random()*.25:.95+Math.random()*.35)).toFixed(2);

  if(p.ll&&Math.random()<.35){const b=pickBuyer(p);G.oc=(G.oc||0)+1;G.offers.push({id:G.oc,k:'loan',pid:p.id,club:b.n,lg:b.lg,ws:rnd([50,75,100]),lf:+(v*(.02+Math.random()*.05)).toFixed(2),opt:Math.random()<.5?+(val(p)*(1+Math.random()*.3)).toFixed(2):0,exp:G.week+3});const lo=G.offers[G.offers.length-1];notify('offer',b.n+', '+p.n+' için kiralık teklifi yaptı ('+fm(lo.lf)+', maaşın %'+lo.ws+"'ini üstleniyor).",{tab:'transfer',mf:'sell'});ntToast(b.n+', '+sn(p.n)+' için kiralık teklifi yaptı')}
 }
}

  case'ec':UI.ec=+d.i;R();break;
  case'newseason':newSeason();save();UI.tab='ozet';UI.fx=true;UI.pb=undefined;R();window.scrollTo(0,0);break;
  case'sort':if(UI.sk===d.k)UI.sd*=-1;else{UI.sk=d.k;UI.sd=(d.k==='n'||d.k==='pos'||d.k==='age')?1:-1}R();break;
  case'pf':UI.pf=d.k;R();break;
  case'mf':UI.mf=d.k;UI.pg=0;R();break;
  case'pg':UI.pg=(UI.pg||0)+ +d.d;R();window.scrollTo(0,0);break;
  case'open':UI.relc=null;UI.modal={t:'p',id:+d.id};R();break;
  case'close':UI.modal=null;R();break;
  case'pri':{const p=U().pl.find(x=>x.id===+d.id);if(p){p.pri=!p.pri;save();R()}break}
  case'form':U().form=d.k;U().manual={};save();R();break;
  case'autoxi':U().manual={};save();R();break;
  case'ment':U().ment=d.k;save();R();break;
  case'slot':UI.modal={t:'slot',i:+d.i};R();break;
  case'setslot':{const t=U();const id=+d.id,i=+d.i;for(const k in t.manual)if(t.manual[k]===id)delete t.manual[k];t.manual[i]=id;UI.modal=null;save();R();break}
  case'clearslot':delete U().manual[+d.i];UI.modal=null;save();R();break;
  case'rw':UI.rw=clamp((UI.rw<0?G.week-1:UI.rw)+ +d.d,0,G.week-1);R();break;
  case'buy':{const e=findEntry(+d.id);if(!e)break;
   if(!winOpen()){toast('Transfer dönemi kapalı');break}
   if(e.free){const dm=demands(e);UI.modal={t:'wage',id:e.p.id,fee:0,so:0,v:dm.w,b:dm.b,y:e.p.age>=33?1:2,msg:''};R();break}
   UI.modal={t:'offer',id:e.p.id,v:askPrice(e),so:0,msg:''};R();break}
  case'loanin':{const e=findEntry(+d.id);if(!e)break;if(!winOpen()){toast('Transfer dönemi kapalı');break}const T=loanTerms(e);UI.modal={t:'loan',id:e.p.id,lf:T.fee,ws:T.ws,opt:0,msg:''};R();break}
  case'setopt':{const el=document.getElementById('optv');if(el)el.value=d.v;break}
  case'submitloan':{const g=x=>document.getElementById(x);tryLoan(+d.id,parseFloat(g('lfv').value),+g('wsv').value,parseFloat(g('optv').value)||0);break}
  case'setwb':{const a=document.getElementById('wgv'),b=document.getElementById('sbv');if(a)a.value=d.w;if(b)b.value=d.b;break}
  case'exopt':exOpt(+d.id);R();break;
  case'tl':case'll':{const p=U().pl.find(x=>x.id===+d.id);if(!p||p.loan)break;p[a]=!p[a];if(p[a]){p.mo=clamp(mo(p)-(a==='tl'?6:3),5,99);toast(p.n+(a==='tl'?' satış listesine kondu':' kiralık listesine kondu'))}save();R();break}
  case'rel':{const t=U(),p=t.pl.find(x=>x.id===+d.id);if(!p)break;if(UI.relc!==p.id){UI.relc=p.id;R();break}
   if(t.pl.length<=18){toast('Kadroda en az 18 oyuncu kalmalı');break}const c=+(p.wg*p.ct*.5).toFixed(2);if(c>t.bud){toast('Tazminat için bütçe yetersiz');break}
   t.bud=+(t.bud-c).toFixed(2);t.pl.splice(t.pl.indexOf(p),1);for(const k in t.manual)if(t.manual[k]===p.id)delete t.manual[k];G.offers=G.offers.filter(o=>o.pid!==p.id);
   cleanP(p);p.club='Serbest';p.lg='';p.ct=0;p.pri=false;G.free.push(p);news(p.n+' serbest bırakıldı ('+fm(c)+' tazminat).');UI.modal=null;UI.relc=null;save();toast(p.n+' serbest bırakıldı');break}
  case'setw':{const el=document.getElementById('wgv');if(el)el.value=d.v;break}
  case'submitwage':{const a=document.getElementById('wgv'),b=document.getElementById('yrs'),c=document.getElementById('sbv');tryWage(+d.id,parseFloat(a&&a.value),parseFloat(c&&c.value)||0,+(b&&b.value||3));break}
  case'renew':{const p=U().pl.find(x=>x.id===+d.id);if(!p)break;const ask=+(Math.max(wageFor(p,G.lid,U().name)*1.02,p.wg*.95)*(mo(p)<40?1.1:1)).toFixed(2),ab=+(ask*.4).toFixed(2);UI.modal={t:'renew',id:p.id,ask,ab,v:ask,b:ab,y:3,msg:''};R();break}
  case'submitrenew':{const a=document.getElementById('wgv'),b=document.getElementById('yrs'),c=document.getElementById('sbv');tryRenew(+d.id,parseFloat(a&&a.value),parseFloat(c&&c.value)||0,+(b&&b.value||3));break}
  case'skipm':clearTicker();UI.tdone=true;R();break;
  case'setoff':{const el=document.getElementById('offv');if(el)el.value=d.v;break}
  case'submitoffer':{const el=document.getElementById('offv'),s=document.getElementById('offso');tryOffer(+d.id,parseFloat(el&&el.value),+(s&&s.value||0));break}
  case'mb':UI.mb=!UI.mb;R();break;
  case'acc':{const o=offerById(+d.i);if(o){if(o.k==='loan')loanOut(o);else completeSale(o,o.price,o.so||0)}R();break}
  case'accnow':{const o=offerById(+d.i);if(o)completeSale(o,o.price,o.so||0);R();break}
  case'rej':{const o=offerById(+d.i);if(o)rejectOffer(o);R();break}
  case'ctr':{const o=offerById(+d.i);if(!o)break;if(!winOpen()){toast('Transfer dönemi kapalı');break}UI.modal={t:'counter',i:o.id,v:+(o.price*1.15).toFixed(2),so:0,msg:''};R();break}
  case'submitctr':{const a=document.getElementById('ctrv'),s=document.getElementById('ctrso');tryCounter(+d.i,parseFloat(a&&a.value),+(s&&s.value||0));break}
 }
});
document.addEventListener('input',e=>{if(e.target.id!=='bslider')return;const v=+e.target.value;UI.bsv=v;const t=U();document.getElementById('bpt').textContent=fm(t.bud-v);document.getElementById('bpw').textContent=fmW(G.wb+v/2)});
document.addEventListener('change',e=>{if(e.target.id==='logoin'){importLogos([...e.target.files]);return}if(e.target.id==='bslider')return;if(e.target.id==='msel'){UI.cm=+e.target.value;R();return}
if(e.target.id==='advsel'){const v=e.target.value;if(v&&!seasonOver()){const c=G.d||0;if(v==='1'){afterPlay(advDay())}else if(v==='win'){const we=winEnd(c);if(we&&we>c){simTo(we);afterPlay(false)}}else if(v==='m'){const r=monthRange(UI.cm);simTo(r.d0+r.dim-1);afterPlay(false)}else{simTo(c+ +v);afterPlay(false)}}else R();return}
if(e.target.id==='formsel'){U().form=e.target.value;U().manual={};save();R();return}const s=e.target.closest('[data-sel]');if(!s)return;UI[s.dataset.sel]=s.value;if(s.dataset.sel[0]==='m')UI.pg=0;R()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal){UI.modal=null;R()}
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&(e.target.classList.contains('dc')||e.target.classList.contains('nt')||e.target.classList.contains('up'))&&e.target.dataset.act){e.preventDefault();e.target.click()}});
R();loadLogos();
</script>
</body>
</html>
